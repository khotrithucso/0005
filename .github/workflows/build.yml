name: Build Android APK - App 0005 (AmpereFlow Battery Monitor)

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # 1. Chuẩn bị tài nguyên Web (HTML, CSS, MAIN.JS) & Tạo cấu hình capacitor.config.json cho App 0005
      - name: Prepare Web Assets & Config
        run: |
          npm init -y
          mkdir -p www
          cp index.html style.css main.js www/ 2>/dev/null || true
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.trithucso.ampereflow_0005_x9z",
            "appName": "AmpereFlow Battery Monitor Pro",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

      # 2. Cài đặt các thư viện Capacitor & AdMob Plugin
      - name: Install Capacitor & Plugins
        run: |
          npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android @capacitor-community/admob

      # 3. Đồng bộ dự án Capacitor Android & Đẩy tệp Web vào thư mục Assets Native
      - name: Add & Sync Capacitor Android Project
        run: |
          npx cap add android || true
          npx cap sync android
          mkdir -p android/app/src/main/assets/public
          cp -r www/* android/app/src/main/assets/public/

      # 3b. TỰ ĐỘNG TẠO NATIVE BRIDGE ĐỌC THÔNG SỐ PIN NÂNG CAO (Nhiệt độ, Điện áp, Dòng điện)
      - name: Inject Native Battery Bridge to MainActivity
        run: |
          mkdir -p android/app/src/main/java/com/trithucso/ampereflow_0005_x9z
          cat << 'EOF' > android/app/src/main/java/com/trithucso/ampereflow_0005_x9z/MainActivity.java
          package com.trithucso.ampereflow_0005_x9z;

          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.os.BatteryManager;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  this.bridge.getWebView().addJavascriptInterface(new BatteryBridge(this), "AndroidBattery");
              }

              public class BatteryBridge {
                  Context context;
                  BatteryBridge(Context c) { context = c; }

                  @JavascriptInterface
                  public String getBatteryStats() {
                      IntentFilter ifilter = new IntentFilter(Intent.ACTION_BATTERY_CHANGED);
                      Intent b = context.registerReceiver(null, ifilter);
                      if (b == null) return "{}";

                      int temp = b.getIntExtra(BatteryManager.EXTRA_TEMPERATURE, 0); // Đơn vị 1/10 độ C
                      int voltage = b.getIntExtra(BatteryManager.EXTRA_VOLTAGE, 0); // mV
                      int level = b.getIntExtra(BatteryManager.EXTRA_LEVEL, 0);
                      int scale = b.getIntExtra(BatteryManager.EXTRA_SCALE, 100);
                      int status = b.getIntExtra(BatteryManager.EXTRA_STATUS, -1);
                      int plug = b.getIntExtra(BatteryManager.EXTRA_PLUGGED, -1);

                      BatteryManager bm = (BatteryManager) context.getSystemService(Context.BATTERY_SERVICE);
                      int currentNow = 0;
                      if (bm != null && android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.LOLLIPOP) {
                          currentNow = bm.getIntProperty(BatteryManager.BATTERY_PROPERTY_CURRENT_NOW);
                      }

                      float pct = (level * 100f) / scale;
                      boolean isCharging = status == BatteryManager.BATTERY_STATUS_CHARGING || status == BatteryManager.BATTERY_STATUS_FULL;

                      return String.format("{\"level\":%.1f,\"voltage\":%d,\"temp\":%.1f,\"current\":%d,\"isCharging\":%b,\"plugType\":%d}",
                          pct, voltage, temp / 10.0f, currentNow, isCharging, plug);
                  }
              }
          }
          EOF

      # 4. Tự động cắt và chuyển đổi icon.png ở thư mục gốc thành bộ Icon App Android (Mipmap)
      - name: Generate Android App Icons from icon.png
        run: |
          python3 -m pip install Pillow --break-system-packages || python3 -m pip install Pillow || true
          python3 -c "
          import os
          from PIL import Image

          sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192
          }

          icon_path = 'icon.png'
          if os.path.exists(icon_path):
              img = Image.open(icon_path).convert('RGBA')
              res_dir = 'android/app/src/main/res'
              for folder, size in sizes.items():
                  out_dir = os.path.join(res_dir, folder)
                  os.makedirs(out_dir, exist_ok=True)
                  resized = img.resize((size, size), Image.Resampling.LANCZOS)
                  resized.save(os.path.join(out_dir, 'ic_launcher.png'), 'PNG')
                  resized.save(os.path.join(out_dir, 'ic_launcher_round.png'), 'PNG')
                  resized.save(os.path.join(out_dir, 'ic_launcher_foreground.png'), 'PNG')
              print('✅ Đã cập nhật icon.png thành công vào tất cả mipmap resolution!')
          else:
              print('⚠️ Không tìm thấy file icon.png!')
          "

      # 5. Khắc phục lỗi xung đột trùng lặp thư viện Kotlin
      - name: Fix Kotlin Duplicate Dependencies
        run: |
          if ! grep -q "kotlin-stdlib-jdk7" android/app/build.gradle; then
            echo "
            configurations.all {
                exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
            }
            " >> android/app/build.gradle
          fi

      # 6. Cấu hình AdMob App ID & Bỏ qua rào cản SSL Mạng (Cleartext Traffic)
      - name: Configure AdMob Network Security & Manifest
        run: |
          mkdir -p android/app/src/main/res/xml
          cat << 'EOF' > android/app/src/main/res/xml/network_security_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true">
                  <trust-anchors>
                      <certificates src="system" />
                      <certificates src="user" />
                  </trust-anchors>
              </base-config>
          </network-security-config>
          EOF

          python3 -c "
          import os
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest_path):
              with open(manifest_path, 'r') as f:
                  content = f.read()
              admob_meta = '<meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"ca-app-pub-3940256099942544~3347511713\"/>'
              if 'APPLICATION_ID' not in content:
                  content = content.replace('</application>', f'    {admob_meta}\n    </application>')
              if 'networkSecurityConfig' not in content:
                  content = content.replace('<application ', '<application android:networkSecurityConfig=\"@xml/network_security_config\" android:usesCleartextTraffic=\"true\" ')
              with open(manifest_path, 'w') as f:
                  f.write(content)
          " || true

      # 7. Cấp quyền thực thi và biên dịch file APK Debug
      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 8. Upload file APK kết quả lên GitHub Artifacts
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-0005-battery-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
 